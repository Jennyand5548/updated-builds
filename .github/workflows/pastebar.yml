name: PasteBar portable
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get latest PasteBar source
        uses: actions/checkout@v4
        with:
          repository: PasteBar/PasteBarApp
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Show Tauri config (diagnostics)
        shell: pwsh
        run: |
          Get-Content src-tauri/tauri.conf.json
          Get-Content src-tauri/tauri.release.conf.json
      - name: Install npm packages
        run: npm install
      - name: Build (installer/signing step may fail, that is OK)
        run: npm run build
        continue-on-error: true
      - name: Make portable zip
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          Get-ChildItem $rel -File | Format-Table Name, Length
          $exe = Get-ChildItem $rel -Filter *.exe -File | Where-Object { $_.Length -gt 5MB } | Select-Object -First 1
          if (-not $exe) { throw "No app .exe was produced - the build really failed, check the Build step log" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/
          Get-ChildItem $rel -Filter *.dll -File | Copy-Item -Destination out/
          Compress-Archive -Path out/* -DestinationPath PasteBar_portable_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PasteBar-portable
          path: PasteBar_portable_x64.zip
          if-no-files-found: error
