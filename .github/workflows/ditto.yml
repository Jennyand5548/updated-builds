name: Ditto portable
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get latest Ditto source
        uses: actions/checkout@v4
        with:
          repository: sabrogden/Ditto
          ref: master
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Install Inno Setup (in case the packaging script needs it)
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Set version
        shell: pwsh
        run: |
          "VERSION_FILENAME=3_25_${{ github.run_number }}_0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION_DOT=3.25.${{ github.run_number }}.0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore NuGet packages
        run: nuget restore CP_Main_10.sln
      - name: Build x64
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
      - name: Stamp version
        run: DittoSetup\rcedit-x64 Release64\Ditto.exe --set-file-version ${{ env.VERSION_DOT }} --set-product-version ${{ env.VERSION_DOT }}
      - name: Build portable zip
        shell: cmd
        run: |
          if not exist DittoSetup\output mkdir DittoSetup\output
          call DittoSetup\BuildPortableZIP.bat "DittoPortable_%VERSION_FILENAME%" bit64
          dir DittoSetup\output
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $zip = (Get-ChildItem DittoSetup/output/*.zip).FullName
          $notes = "Unsigned x64 portable build of Ditto, built from upstream master.`n`nUpstream commit: https://github.com/sabrogden/Ditto/commit/$sha"
          gh release create "ditto-3.25.${{ github.run_number }}" $zip --repo "${{ github.repository }}" --title "Ditto portable $env:VERSION_FILENAME" --notes $notes
